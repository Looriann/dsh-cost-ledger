name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 零依赖：不需要 npm install，装个包反而会掩盖漏声明的依赖
      - name: 语法检查
        run: npm run check

      - name: 单元测试 + 插件冒烟
        run: npm test